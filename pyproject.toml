[project]
name = "gnu-mau"
version = "0.1.0"
description = ""
authors = [
    {name = "l337quez",email = "l337quez.dev@gmail.com"}
]
license = {text = "GPL V3"}
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyside6 (==6.5.0)",
    "markdown2 (>=2.5.4,<3.0.0)",
    "mongita (>=1.2.0,<2.0.0)",
    # mongita exposes the bson API through pymongo; declare it explicitly
    "pymongo (>=4.0,<5.0)",
    "python-dotenv (>=1.0,<2.0)",
    "qtpynodeeditor (>=0.3.3,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyinstaller (>=6.17.0,<7.0.0)"
]
